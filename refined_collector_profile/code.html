<style>
        body {
            background-color: #071325;
            color: #d7e3fc;
            font-family: 'Work Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(20, 32, 50, 0.8) 0%, rgba(16, 28, 46, 0.9) 100%);
            backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#071325] dark:bg-[#071325] flex items-center px-6 h-20 w-full">
<div class="flex items-center gap-4">
<button class="text-[#00E676] active:scale-95 duration-150 hover:bg-[#1f2a3d] transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Work_Sans'] font-bold text-xl tracking-tight text-[#00E676]">Collector Profile</h1>
</div>
</header>
<main class="flex-grow container mx-auto px-6 py-12 flex flex-col items-center justify-start max-w-lg">
<!-- Profile Identity Section -->
<div class="mb-12 flex flex-col items-center">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center mb-6 shadow-[0_0_50px_rgba(0,230,118,0.1)] border-2 border-primary-container/20">
<span class="material-symbols-outlined text-primary-container text-6xl" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<h2 class="text-3xl font-extrabold tracking-tight text-on-surface text-center">Active Collector</h2>
<p class="text-on-surface-variant font-medium tracking-wide uppercase text-xs mt-2">Authorized Personnel Only</p>
</div>
<!-- Credentials Card -->
<section class="w-full glass-card rounded-[2rem] p-8 space-y-10 shadow-2xl relative overflow-hidden">
<!-- Subtle accent glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Collector ID Field (Moved to Top) -->
<div class="relative group">
<div class="flex items-center gap-4 mb-2">
<span class="material-symbols-outlined text-primary-container text-2xl" data-icon="fingerprint">fingerprint</span>
<label class="text-on-surface-variant text-sm font-semibold tracking-widest uppercase">Collector ID</label>
</div>
<div class="bg-surface-container-low/50 rounded-2xl p-6 border-b-2 border-transparent group-focus-within:border-primary-container transition-all">
<div class="flex items-center justify-between">
<p class="text-2xl font-mono font-bold text-on-surface tracking-wider">ET-4829-9910</p>
</div>
</div>
</div>
<!-- Password Section (Added below Collector ID) -->
<div class="relative group">
<div class="flex items-center gap-4 mb-2">
<span class="material-symbols-outlined text-primary-container text-2xl" data-icon="lock">lock</span>
<label class="text-on-surface-variant text-sm font-semibold tracking-widest uppercase">Password</label>
</div>
<div class="bg-surface-container-low/50 rounded-2xl p-6 border-b-2 border-transparent group-focus-within:border-primary-container transition-all">
<div class="flex items-center justify-between">
<p class="text-2xl font-mono font-bold text-on-surface tracking-wider" data-full-pw="EC0-SECURE-88" id="password-field">••••••••</p>
<button class="text-primary-container hover:bg-primary-container/10 p-2 rounded-full transition-colors active:scale-90" id="toggle-password">
<span class="material-symbols-outlined text-2xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
</section>
<!-- Logout Action -->
<div class="w-full mt-12 px-2">
<button class="w-full h-20 bg-error-container/20 border-2 border-error/30 hover:bg-error-container/40 text-error rounded-[1.5rem] flex items-center justify-center gap-3 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-3xl group-hover:rotate-12 transition-transform" data-icon="logout">logout</span>
<span class="text-xl font-black uppercase tracking-widest">Logout</span>
</button>
<p class="text-center text-on-surface-variant/40 text-[10px] mt-8 uppercase tracking-[0.2em]">Session ID: 4829-9910-AA21</p>
</div>
</main>
<script>
  document.getElementById('toggle-password').addEventListener('click', function() {
    const pwElement = document.getElementById('password-field');
    const iconElement = this.querySelector('.material-symbols-outlined');
    const fullPw = pwElement.getAttribute('data-full-pw');
    const maskedPw = '••••••••';

    if (pwElement.textContent === maskedPw) {
      pwElement.textContent = fullPw;
      iconElement.textContent = 'visibility_off';
      iconElement.setAttribute('data-icon', 'visibility_off');
    } else {
      pwElement.textContent = maskedPw;
      iconElement.textContent = 'visibility';
      iconElement.setAttribute('data-icon', 'visibility');
    }
  });
</script>
</body></html>
